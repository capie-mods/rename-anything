<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" width="880" height="486" role="img" aria-labelledby="t d">
  <title id="t">Rename Anything is built on CAPIE</title>
  <desc id="d">Three layers. Top: mod scripts from the Steam Workshop: Rename Anything, which works today, and your own mod calling CAPIE effects, which is planned. Middle: CAPIE, Cyprian's API Extender, one native DLL started by the CAPIE launcher. It already provides country name and adjective support and the bridge from native text fields to game commands; a public API for other mods and a multiplayer handshake are planned. Bottom: the unmodified Hearts of Iron IV 1.19.3.0 engine with game commands, localisation lookups and the save file. Pulses show requests going down and names coming back up.</desc>
  <!-- Tokens: docs/design/tokens.json v1.1.0 -->
  <style>
    .canvas{fill:#272421}
    .rim{fill:none;stroke:#3c3936;stroke-width:1}
    .caps{font:700 11.5px Ubuntu,'Segoe UI','DejaVu Sans',Verdana,sans-serif;letter-spacing:.14em;fill:#ffbd00}
    .title{font:700 15px Ubuntu,'Segoe UI','DejaVu Sans',Verdana,sans-serif;fill:#ece6d3}
    .body{font:400 12px Ubuntu,'Segoe UI','DejaVu Sans',Verdana,sans-serif;fill:#c3b091}
    .chiptext{font:400 12px Ubuntu,'Segoe UI','DejaVu Sans',Verdana,sans-serif;fill:#ece6d3}
    .cap{font:400 12px Ubuntu,'Segoe UI','DejaVu Sans',Verdana,sans-serif;fill:#a39a86}
    .tag{font:700 10px Ubuntu,'Segoe UI','DejaVu Sans',Verdana,sans-serif;letter-spacing:.08em}
    .t-today{fill:#7db35a}
    .t-plan{fill:#d0a070}
    .node{fill:#161412;stroke:#76776b;stroke-width:1.25}
    .node-plan{fill:#161412;stroke:#908060;stroke-width:1.25;stroke-dasharray:5 4}
    .native{fill:#161412;stroke:#d0a070;stroke-width:1.75}
    .chip{fill:#2e3627;stroke:#424e38;stroke-width:1}
    .chip-plan{fill:#161412;stroke:#908060;stroke-width:1;stroke-dasharray:5 4}
    .wire{stroke:#76776b;stroke-width:1.5;fill:none}
    .wire-plan{stroke:#908060;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .down{fill:#ffbd00}
    .up{fill:#7db35a}
    .down,.up{opacity:0}
    @media (prefers-reduced-motion:no-preference){
      .down{animation:down 3.2s cubic-bezier(.16,1,.3,1) infinite}
      .up{animation:up 3.2s cubic-bezier(.16,1,.3,1) infinite}
      .late{animation-delay:1.6s}
    }
    @keyframes down{0%{opacity:0;transform:translateY(0)}12%{opacity:1}72%{opacity:1;transform:translateY(34px)}80%,100%{opacity:0;transform:translateY(34px)}}
    @keyframes up{0%{opacity:0;transform:translateY(0)}12%{opacity:1}72%{opacity:1;transform:translateY(-34px)}80%,100%{opacity:0;transform:translateY(-34px)}}
  </style>

  <rect class="canvas" width="880" height="486" rx="6"/>
  <rect class="rim" x="8.5" y="8.5" width="863" height="469" rx="4"/>

  <!-- Legend -->
  <g transform="translate(618 26)">
    <rect width="10" height="10" fill="#507040"/>
    <text class="cap" x="16" y="9.5">works today</text>
    <rect x="120" width="10" height="10" fill="none" stroke="#908060" stroke-dasharray="3 2"/>
    <text class="cap" x="136" y="9.5">planned</text>
  </g>

  <!-- Layer 1: mod scripts -->
  <text class="caps" x="32" y="38">MOD SCRIPTS, FROM THE STEAM WORKSHOP</text>
  <rect class="node" x="32" y="52" width="478" height="88" rx="2"/>
  <!-- pencil mark -->
  <g transform="translate(48 66)">
    <rect width="20" height="20" rx="1" fill="#3c3b38" stroke="#76776b" stroke-width="1"/>
    <rect x="4" y="3.5" width="10" height="13" fill="#406030"/>
    <path d="M7 15.5 L7 13 L14.5 5.5 L17 8 L9.5 15.5 Z" fill="#c3b091"/>
  </g>
  <text class="title" x="78" y="81">Rename Anything</text>
  <text class="tag t-today" x="438" y="78">TODAY</text>
  <text class="body" x="48" y="106">Pencils next to names, native text fields, state and</text>
  <text class="body" x="48" y="124">city lists, a 5-day cooldown per object</text>

  <rect class="node-plan" x="530" y="52" width="318" height="88" rx="2"/>
  <text class="title" x="546" y="81">Your mod</text>
  <text class="tag t-plan" x="768" y="78">PLANNED</text>
  <text class="body" x="546" y="106">Calls CAPIE effects such as</text>
  <text class="body" x="546" y="124">set_custom_*_name, reads names back</text>

  <!-- wires layer 1 to 2 -->
  <line class="wire" x1="271" y1="140" x2="271" y2="186"/>
  <line class="wire-plan" x1="689" y1="140" x2="689" y2="186"/>
  <circle class="down" cx="263" cy="146" r="3.5"/>
  <circle class="up late" cx="279" cy="180" r="3.5"/>
  <circle class="down late" cx="681" cy="146" r="3.5"/>
  <circle class="up" cx="697" cy="180" r="3.5"/>

  <!-- Layer 2: CAPIE -->
  <rect class="native" x="32" y="186" width="816" height="150" rx="2"/>
  <!-- connector mark -->
  <g transform="translate(48 200)">
    <rect width="20" height="20" rx="1" fill="#161412" stroke="#d0a070" stroke-width="1.5"/>
    <rect x="4" y="5" width="7" height="2" fill="#d0a070"/>
    <rect x="4" y="9" width="7" height="2" fill="#d0a070"/>
    <rect x="4" y="13" width="7" height="2" fill="#d0a070"/>
    <rect x="12" y="4" width="4" height="12" fill="#d0a070"/>
  </g>
  <text class="title" x="78" y="215">CAPIE</text>
  <text class="body" x="130" y="215">Cyprian's API Extender: one native DLL, started by the CAPIE launcher</text>
  <rect class="chip" x="48" y="234" width="188" height="84" rx="2"/>
  <text class="chiptext" x="60" y="258">Country name and</text>
  <text class="chiptext" x="60" y="276">adjective</text>
  <text class="tag t-today" x="60" y="304">TODAY</text>
  <rect class="chip" x="248" y="234" width="188" height="84" rx="2"/>
  <text class="chiptext" x="260" y="258">Native text field to</text>
  <text class="chiptext" x="260" y="276">game command</text>
  <text class="tag t-today" x="260" y="304">TODAY</text>
  <rect class="chip-plan" x="448" y="234" width="188" height="84" rx="2"/>
  <text class="chiptext" x="460" y="258">Public API: effects,</text>
  <text class="chiptext" x="460" y="276">getters, version check</text>
  <text class="tag t-plan" x="460" y="304">PLANNED</text>
  <rect class="chip-plan" x="648" y="234" width="184" height="84" rx="2"/>
  <text class="chiptext" x="660" y="258">Multiplayer handshake:</text>
  <text class="chiptext" x="660" y="276">refuse a missing DLL</text>
  <text class="tag t-plan" x="660" y="304">PLANNED</text>

  <!-- wires layer 2 to 3 -->
  <line class="wire" x1="271" y1="336" x2="271" y2="382"/>
  <line class="wire" x1="609" y1="336" x2="609" y2="382"/>
  <circle class="down late" cx="263" cy="342" r="3.5"/>
  <circle class="up" cx="279" cy="376" r="3.5"/>
  <circle class="down" cx="601" cy="342" r="3.5"/>
  <circle class="up late" cx="617" cy="376" r="3.5"/>

  <!-- Layer 3: game -->
  <text class="caps" x="32" y="372">HEARTS OF IRON IV 1.19.3.0</text>
  <rect class="node" x="32" y="382" width="816" height="80" rx="2"/>
  <rect class="chip" x="48" y="398" width="200" height="48" rx="2"/>
  <text class="chiptext" x="62" y="427">Game commands</text>
  <rect class="chip" x="262" y="398" width="200" height="48" rx="2"/>
  <text class="chiptext" x="276" y="427">Localisation lookups</text>
  <rect class="chip" x="476" y="398" width="200" height="48" rx="2"/>
  <text class="chiptext" x="490" y="427">Save file</text>
  <text class="cap" x="694" y="418">Game files are</text>
  <text class="cap" x="694" y="436">never modified</text>
</svg>
