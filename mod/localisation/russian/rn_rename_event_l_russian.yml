l_russian:
 RN_RULE_RENAME_EVENT:0 "Rename Anything: news of a new country name"
 RN_RULE_RENAME_EVENT_OFF:0 "Off"
 RN_RULE_RENAME_EVENT_OFF_DESC:0 "Country names change quietly."
 RN_RULE_RENAME_EVENT_ON:0 "On"
 RN_RULE_RENAME_EVENT_ON_DESC:0 "Everyone gets a news event when a player renames a country or restores its original name."
 rn_rename.1.t:0 "[Root.RN_OLD_0][Root.RN_OLD_1][Root.RN_OLD_2][Root.RN_OLD_3][Root.RN_OLD_4][Root.RN_OLD_5][Root.RN_OLD_6][Root.RN_OLD_7][Root.RN_OLD_8][Root.RN_OLD_9][Root.RN_OLD_10][Root.RN_OLD_11][Root.RN_OLD_12][Root.RN_OLD_13][Root.RN_OLD_14][Root.RN_OLD_15][Root.RN_OLD_16][Root.RN_OLD_17][Root.RN_OLD_18][Root.RN_OLD_19][Root.RN_OLD_20][Root.RN_OLD_21][Root.RN_OLD_22][Root.RN_OLD_23][Root.RN_OLD_24][Root.RN_OLD_25][Root.RN_OLD_26][Root.RN_OLD_27][Root.RN_OLD_28][Root.RN_OLD_29][Root.RN_OLD_30][Root.RN_OLD_31] Changes Its Name to [Root.GetName]"
 rn_rename.1.t_new:0 "New country name: [Root.GetName]"
 rn_rename.1.d1:0 "Workmen in [Root.Capital.GetName] spent the morning taking down the old signs. From today the country is called [Root.GetName], and [Root.GetAdjective] passports and stamps will change by the end of the year."
 rn_rename.1.d2:0 "In a short radio address, [Root.GetLeader] said the nation will be known as [Root.GetName] from now on. Foreign ministries were told by telegram. Most sent polite congratulations; a few asked what was wrong with the old name."
 rn_rename.1.d3:0 "The mapmakers are busy again. [Root.GetName] adopted its new name by decree, and [Root.GetAdjective] newspapers printed it across every front page. Foreign offices noted the change without comment."
 rn_rename.1.d4:0 "The decision came quickly and without debate. Diplomats will have to get used to writing [Root.GetName], and the [Root.GetAdjective] delegation has already ordered new name cards."
 rn_rename.1.a:0 "Noted."
