l_polish:
 RN_RULE_RENAME_EVENT:0 "Rename Anything: wiadomość o nowej nazwie państwa"
 RN_RULE_RENAME_EVENT_OFF:0 "Wyłączone"
 RN_RULE_RENAME_EVENT_OFF_DESC:0 "Nazwy państw zmieniają się po cichu."
 RN_RULE_RENAME_EVENT_ON:0 "Włączone"
 RN_RULE_RENAME_EVENT_ON_DESC:0 "Każdy gracz dostaje wiadomość, gdy gracz zmieni nazwę państwa albo ją przywróci."
 rn_rename.1.t:0 "[Root.RN_OLD_0][Root.RN_OLD_1][Root.RN_OLD_2][Root.RN_OLD_3][Root.RN_OLD_4][Root.RN_OLD_5][Root.RN_OLD_6][Root.RN_OLD_7][Root.RN_OLD_8][Root.RN_OLD_9][Root.RN_OLD_10][Root.RN_OLD_11][Root.RN_OLD_12][Root.RN_OLD_13][Root.RN_OLD_14][Root.RN_OLD_15][Root.RN_OLD_16][Root.RN_OLD_17][Root.RN_OLD_18][Root.RN_OLD_19][Root.RN_OLD_20][Root.RN_OLD_21][Root.RN_OLD_22][Root.RN_OLD_23][Root.RN_OLD_24][Root.RN_OLD_25][Root.RN_OLD_26][Root.RN_OLD_27][Root.RN_OLD_28][Root.RN_OLD_29][Root.RN_OLD_30][Root.RN_OLD_31] zmienia nazwę na [Root.GetName]"
 rn_rename.1.t_new:0 "Nowa nazwa państwa: [Root.GetName]"
 rn_rename.1.d1:0 "Robotnicy w mieście [Root.Capital.GetName] od rana zdejmowali stare szyldy. Od dziś państwo nazywa się [Root.GetName], a do końca roku zmienią się też paszporty i znaczki."
 rn_rename.1.d2:0 "W krótkim orędziu radiowym [Root.GetLeader] zapowiada, że naród będzie odtąd znany jako [Root.GetName]. Ministerstwa spraw zagranicznych zawiadomiono telegraficznie. Większość odpowiedziała uprzejmymi gratulacjami, kilka zapytało, co było nie tak ze starą nazwą."
 rn_rename.1.d3:0 "Kartografowie znów mają pełne ręce roboty. Nową nazwę, [Root.GetName], przyjęto dekretem, a gazety wydrukowały ją na każdej pierwszej stronie. Zagraniczne ministerstwa przyjęły zmianę bez komentarza."
 rn_rename.1.d4:0 "Decyzję podjęto szybko i bez dyskusji. Dyplomaci będą musieli przywyknąć do nazwy [Root.GetName], a delegacja już zamówiła nowe wizytówki."
 rn_rename.1.a:0 "Przyjęto do wiadomości."
