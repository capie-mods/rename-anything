l_polish:
 RN_RULE_RENAME_EVENT:0 "Rename Anything: wiadomość o nowej nazwie państwa"
 RN_RULE_RENAME_EVENT_OFF:0 "Wyłączone"
 RN_RULE_RENAME_EVENT_OFF_DESC:0 "Nazwy państw zmieniają się po cichu."
 RN_RULE_RENAME_EVENT_ON:0 "Włączone"
 RN_RULE_RENAME_EVENT_ON_DESC:0 "Każdy gracz dostaje wiadomość, gdy gracz zmieni nazwę państwa albo ją przywróci."
 rn_rename.1.t:0 "[From.RN_OLD_0][From.RN_OLD_1][From.RN_OLD_2][From.RN_OLD_3][From.RN_OLD_4][From.RN_OLD_5][From.RN_OLD_6][From.RN_OLD_7][From.RN_OLD_8][From.RN_OLD_9][From.RN_OLD_10][From.RN_OLD_11][From.RN_OLD_12][From.RN_OLD_13][From.RN_OLD_14][From.RN_OLD_15][From.RN_OLD_16][From.RN_OLD_17][From.RN_OLD_18][From.RN_OLD_19][From.RN_OLD_20][From.RN_OLD_21][From.RN_OLD_22][From.RN_OLD_23][From.RN_OLD_24][From.RN_OLD_25][From.RN_OLD_26][From.RN_OLD_27][From.RN_OLD_28][From.RN_OLD_29][From.RN_OLD_30][From.RN_OLD_31] zmienia nazwę na [From.GetName]"
 rn_rename.1.t_new:0 "[From.GetName] przyjmuje nową nazwę"
 rn_rename.1.d1:0 "Robotnicy w mieście [From.Capital.GetName] od rana zdejmowali stare szyldy. Od dziś państwo nazywa się [From.GetName], a do końca roku zmienią się też paszporty i znaczki."
 rn_rename.1.d2:0 "W krótkim orędziu radiowym [From.GetLeader] zapowiada, że naród będzie odtąd znany jako [From.GetName]. Ministerstwa spraw zagranicznych zawiadomiono telegraficznie. Większość odpowiedziała uprzejmymi gratulacjami, kilka zapytało, co było nie tak ze starą nazwą."
 rn_rename.1.d3:0 "Kartografowie znów mają pełne ręce roboty. Nową nazwę, [From.GetName], przyjęto dekretem, a gazety wydrukowały ją na każdej pierwszej stronie. Zagraniczne ministerstwa przyjęły zmianę bez komentarza."
 rn_rename.1.d4:0 "Decyzję podjęto szybko i bez dyskusji. Dyplomaci będą musieli przywyknąć do nazwy [From.GetName], a delegacja już zamówiła nowe wizytówki."
 rn_rename.1.a:0 "Przyjęto do wiadomości."
